<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sugestões ESTGV</title>
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Sugestões ESTGV</h1>
    <p id="mensagem" role="alert"></p>
    <section id="entrada">
      <h2>Entrar</h2>
      <form id="formulario">
        <label for="utilizador">Utilizador</label>
        <input id="utilizador" autocomplete="username" required>
        <label for="palavraPasse">Palavra-passe</label>
        <input id="palavraPasse" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
        <button id="entrar" type="submit">Entrar</button>
      </form>
    </section>
    <section id="sessao" hidden>
      <h2 id="nome"></h2><p id="papel"></p>
      <p>Hora de expiração: <span id="expiracao"></span></p>
      <p>Sessão termina em <span id="tempo"></span> segundos.</p>
      <button id="carregar" type="button">As minhas sugestões</button>
      <button id="sair" type="button">Terminar sessão</button>
      <ul id="sugestoes"></ul>
    </section>
  </main>
</body>
</html>
